name: crawl-guilds

# 검은사막 길드 정보를 주기적으로 읽어서 guilds.json을 갱신한다.
# (브라우저에서는 CORS 때문에 직접 읽을 수 없어서, 앱은 이 파일을 받아간다)
on:
  schedule:
    - cron: '7 * * * *' # 1시간마다 (매시 7분)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Crawl guilds
        run: node scripts/crawl-guilds.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- guilds.json; then
            echo "no changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add guilds.json
            git commit -m "chore: update guilds.json"
            git push
          fi
