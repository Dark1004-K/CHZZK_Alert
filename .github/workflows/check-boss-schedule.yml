name: check-boss-schedule

# 검은사막 위키의 월드 우두머리 레이드 시간표 이미지를 매일 확인한다.
# 이미지가 바뀌었으면 Gemini로 표를 읽어 bosses.json을 자동 갱신하고(검증 통과 시에만),
# 변경 내역을 Issue로 남긴다. 판독에 실패하면 자동 커밋하지 않고 사람이 확인하는 Issue를 만든다.
#
# - 예약은 UTC 기준: 02:47 UTC = 11:47(한국시간). GitHub 예약은 몇 분 늦어질 수 있다.
# - AI는 시크릿 GEMINI_API_KEY(Google AI Studio에서 발급, 무료 티어)가 있어야 켜진다.
#   키가 없으면 예전처럼 "이미지가 바뀌었습니다" 알림만 보낸다.
# - 정기 감지는 이 워크플로우가 맡는다. Google Apps Script의 bossCheck(수요일 주 1회)는
#   백업으로 남겨 둔다(둘 다 같은 data/boss-schedule-state.json을 보므로 먼저 갱신한 쪽이 이긴다).
on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check and update boss schedule
        id: chk
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-boss-schedule.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boss-schedule-state.json bosses.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: update boss schedule from wiki timetable"
            git push
          fi
      - name: Open an issue (AI updated or needs review)
        if: steps.chk.outputs.changed == 'true' && steps.chk.outputs.body != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MODIFIED: ${{ steps.chk.outputs.modified }}
          NEEDS_REVIEW: ${{ steps.chk.outputs.needsReview }}
          BODY: ${{ steps.chk.outputs.body }}
        run: |
          if [ "$NEEDS_REVIEW" = "true" ]; then
            TITLE="[우두머리 시간표] 자동 판독 실패 — 확인 필요 (${MODIFIED})"
          else
            TITLE="[우두머리 시간표] AI가 시간표를 갱신했습니다 (${MODIFIED})"
          fi
          gh issue create --title "$TITLE" --body "$BODY"
