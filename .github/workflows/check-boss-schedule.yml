name: check-boss-schedule

# 검은사막 위키의 월드 우두머리 레이드 시간표를 확인하고, 바뀌었으면 AI(Gemini)로 표를 읽어
# bosses.json을 자동 갱신한다. 검증에 실패하면 자동 커밋하지 않고 사람이 확인하는 Issue를 만든다.
#
# 정기 실행은 Google Apps Script(workers/coupon-cron/chzzk-cron.gs의 bossCheck, 매일 오전 11시대)가 맡는다.
# GitHub 예약 실행(schedule)은 몇 시간씩 밀려서 시각 보장이 안 되기 때문이다.
# GAS가 위키 변경을 감지하면 이 워크플로우를 디스패치하고, 여기서 다시 확인한 뒤 판독한다.
# AI는 시크릿 GEMINI_API_KEY(Google AI Studio에서 발급, 무료 티어)가 있어야 켜진다.
# 키가 없으면 "이미지가 바뀌었습니다" 알림만 보낸다.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: check-boss-schedule
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check and update boss schedule
        id: chk
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-boss-schedule.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boss-schedule-state.json bosses.json plugins.json release/plugins.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: update boss schedule from wiki timetable"
          # 저장소 커밋이 잦아서 push가 non-fast-forward로 실패할 수 있으니 rebase 후 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            echo "push failed (try $i/3), retrying..."
            sleep 10
          done
          git status -sb
      - name: Open an issue (AI updated or needs review)
        if: steps.chk.outputs.changed == 'true' && steps.chk.outputs.body != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MODIFIED: ${{ steps.chk.outputs.modified }}
          NEEDS_REVIEW: ${{ steps.chk.outputs.needsReview }}
          BODY: ${{ steps.chk.outputs.body }}
        run: |
          if [ "$NEEDS_REVIEW" = "true" ]; then
            TITLE="[우두머리 시간표] 자동 판독 실패 — 확인 필요 (${MODIFIED})"
          else
            TITLE="[우두머리 시간표] AI가 시간표를 갱신했습니다 (${MODIFIED})"
          fi
          # 같은 수정일시의 열린 Issue가 이미 있으면 중복 생성하지 않는다 (실패 시 매일 재시도되므로)
          if gh issue list --state open --limit 30 --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "이미 같은 Issue가 있어 건너뜁니다: $TITLE"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
      - name: Close stale failure issues
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search "[우두머리 시간표] 워크플로우 실패 in:title" --limit 5 --json number --jq '.[].number' | grep -E '^[0-9]+$'); do
            gh issue close "$n" --comment "워크플로우가 다시 성공했습니다. 자동 종료합니다." || true
          done
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh issue list --state open --search "[우두머리 시간표] 워크플로우 실패 in:title" --limit 1 --json number --jq '.[].number' | grep -qE '^[0-9]+$'; then
            echo "already reported"
          else
            gh issue create \
              --title "[우두머리 시간표] 워크플로우 실패 — 확인 필요" \
              --body "우두머리 시간표 확인 워크플로우가 예외로 실패했습니다. Actions 로그를 확인해 주세요.

          - 워크플로우: check-boss-schedule
          - 실행: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - 위키: https://www.kr.playblackdesert.com/ko-kr/Wiki?wikiNo=167"
          fi
